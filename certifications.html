        .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px; }
        .cert-card { display: flex; flex-direction: column; }
        .cert-card .thumb { height: 200px; background: #2b2f33; display: flex; align-items: center; justify-content: center; color: #888; cursor: zoom-in; overflow: hidden; border-radius: 4px 4px 0 0; }

        .cert-card .card-body { display: flex; flex-direction: column; flex: 1; }
        .cert-meta { color: rgba(234,252,156,.95); font-size: 14px; margin-bottom: 10px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

        .cert-card .learnmore { margin-top: auto; }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out; padding: 20px; }

    const grid = document.getElementById('grid');
    const filters = document.getElementById('filters');
    const empty = document.getElementById('empty');
    const box = document.getElementById('lightbox');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function card(c) {
        const applied = c.applied
            ? `<p class="applied">Applied in: <a href="${esc(c.applied.url)}" target="_blank" rel="noopener">${esc(c.applied.label)}</a></p>` : '';
        return `<div class="card border-light text-light bg-dark cert-card" data-cat="${esc(c.category)}">
            <div class="thumb" data-img="${esc(c.image)}" tabindex="0" role="button" aria-label="Enlarge certificate: ${esc(c.title)}">
                <img src="${esc(c.image)}" alt="Certificate: ${esc(c.title)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('Certificate image'))">
            </div>
            <div class="card-body">
                <h5 class="card-title">${esc(c.title)}</h5>
                <p class="cert-meta">Udemy · ${esc(c.instructor)} · ${esc(c.date)} · ${esc(c.hours)} hours</p>
                <div class="chips">${c.skills.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>
                ${applied}
                <div class="learnmore"><a href="${esc(c.url)}" target="_blank" rel="noopener"><button class="shrink-border">View Credential</button></a></div>
            </div>
        </div>`;
    }

    grid.innerHTML = CERTS.map(card).join('');
    const cats = ['All', ...new Set(CERTS.map(c => c.category))];
    filters.innerHTML = cats.map((c, i) => `<button type="button" data-cat="${esc(c)}" class="${i ? '' : 'active'}">${esc(c)}</button>`).join('');

    filters.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        filters.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
        let shown = 0;
        grid.querySelectorAll('.cert-card').forEach(el => {
            const on = b.dataset.cat === 'All' || el.dataset.cat === b.dataset.cat;
            el.style.display = on ? '' : 'none'; if (on) shown++;
        });
        empty.style.display = shown ? 'none' : 'block';
    });

    function openBox(src) { box.querySelector('img').src = src; box.classList.add('open'); }
    grid.addEventListener('click', e => { const t = e.target.closest('.thumb'); if (t) openBox(t.dataset.img); });
    grid.addEventListener('keydown', e => { const t = e.target.closest('.thumb'); if (t && e.key === 'Enter') openBox(t.dataset.img); });
    box.addEventListener('click', () => box.classList.remove('open'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') box.classList.remove('open'); });
