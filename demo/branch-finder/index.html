<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Branch Finder Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>


<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100vh; width: 100%; }
  #info {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); max-width: 260px;
  }
  #info h3 { margin: 0 0 8px; font-size: 15px; }
  #info p { margin: 4px 0; font-size: 13px; color: #333; }
  .loading { color: #888; font-style: italic; }
</style>
</head>
<body>

<div id="map"></div>
<div id="info">
  <h3>Branch Finder</h3>
  <p>Click anywhere on the map to find the assigned branch and delivery ETA.</p>
  <p style="font-size: 12px; color: #888;">Coverage area: Metro Manila (Quezon City to Pasay). Clicks outside this area will show "no coverage."</p>
  <div id="result"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<script>
const API_BASE = "https://branch-finder-api-bf4d.onrender.com";

const map = L.map('map').setView([14.58, 121.02], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    referrerPolicy: "no-referrer-when-downgrade",
    attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

// L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
// 	attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
// }).addTo(map);

let marker = null;
const resultEl = document.getElementById('result');

map.on('click', async (e) => {
  const { lat, lng } = e.latlng;

  if (marker) map.removeLayer(marker);
  marker = L.marker([lat, lng]).addTo(map);

  resultEl.innerHTML = `<p class="loading">Waking up the server… this can take up to a minute on first load.</p>`;

  try {
    const res = await fetch(`${API_BASE}/api/assign/?lat=${lat}&lng=${lng}`);
    const data = await res.json();

    if (data.assigned) {
      resultEl.innerHTML = `
        <p><strong>Branch:</strong> ${data.branch.name}</p>
        <p><strong>ETA:</strong> ${data.eta_minutes} minutes</p>
      `;
    } else {
      resultEl.innerHTML = `<p>No coverage at this location.</p>`;
    }
  } catch (err) {
    resultEl.innerHTML = `<p>Couldn't reach the API. Try again in a moment.</p>`;
  }
});
</script>

</body>
</html>
